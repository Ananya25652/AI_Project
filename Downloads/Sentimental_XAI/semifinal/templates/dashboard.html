{% extends "base.html" %}
{% block content %}
<div style="width:100%;display:flex;gap:20px;flex-wrap:wrap;">
  <div class="card" style="flex:1;min-width:300px">
    <h2>Dashboard</h2>
    <p class="muted">Welcome back, <strong>{{ username }}</strong></p>
    <div style="margin-top:12px">
      <a class="btn" href="{{ url_for('voice_page') }}">Voice Analysis</a>
      <a class="btn" href="{{ url_for('text_page') }}">Text Analysis</a>
    </div>
    <div style="margin-top:18px" class="small muted">
      Use the controls to record audio or paste text. Both LIME & SHAP explanations will be generated.
    </div>
  </div>
</div>
{% endblock %}
